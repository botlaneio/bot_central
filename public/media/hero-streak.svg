<svg preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000">
  <!-- botLane hero streak: an original twisted ribbon in orange, pink and purple. Static artwork, crisp edges (no blur). -->
  <defs>
    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfe4ff"/>
      <stop offset=".35" stop-color="#a99cff"/>
      <stop offset=".7" stop-color="#f77ce0"/>
      <stop offset="1" stop-color="#ff86c8"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#ffb03a"/>
      <stop offset=".45" stop-color="#ff8a1f"/>
      <stop offset=".8" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#ff6a5c"/>
      <stop offset=".4" stop-color="#f891b8"/>
      <stop offset=".7" stop-color="#ff7f87"/>
      <stop offset="1" stop-color="#f47cf0"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5cff" stop-opacity="0"/>
      <stop offset=".6" stop-color="#7a5cff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#5333f5"/>
    </linearGradient>
    <!-- Fine silk threads: hairlines laid over the ribbons for texture. -->
    <pattern id="threads" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(28)">
      <rect width="6" height="1.1" fill="#ffffff" fill-opacity=".32"/>
    </pattern>
    <pattern id="threads2" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="rotate(-62)">
      <rect width="11" height="1" fill="#5333f5" fill-opacity=".10"/>
    </pattern>
  </defs>
  <g>
    <path d="M150 0 L520 0 C640 230 800 420 960 560 C1040 640 1080 720 1020 800 L990 790 C800 690 560 560 380 330 C290 215 210 100 150 0 Z" fill="url(#cool)"/>
    <path d="M700 0 L880 0 C960 220 1040 430 1150 660 C1230 820 1310 930 1350 1000 L1210 1000 C1150 850 1070 680 1010 470 C960 300 840 120 700 0 Z" fill="url(#edge)"/>
    <path d="M410 0 L720 0 C850 230 960 420 1030 640 C1070 780 1060 900 1050 1000 L990 1000 C1000 860 980 700 900 560 C780 360 560 200 410 0 Z" fill="url(#warm)"/>
    <path d="M1010 700 C1040 800 1060 900 1060 1000 L1130 1000 C1120 900 1100 800 1060 700 Z" fill="url(#core)"/>
  </g>
  <g>
    <path d="M150 0 L520 0 C640 230 800 420 960 560 C1040 640 1080 720 1020 800 L990 790 C800 690 560 560 380 330 C290 215 210 100 150 0 Z" fill="url(#threads)"/>
    <path d="M150 0 L520 0 C640 230 800 420 960 560 C1040 640 1080 720 1020 800 L990 790 C800 690 560 560 380 330 C290 215 210 100 150 0 Z" fill="url(#threads2)"/>
    <path d="M700 0 L880 0 C960 220 1040 430 1150 660 C1230 820 1310 930 1350 1000 L1210 1000 C1150 850 1070 680 1010 470 C960 300 840 120 700 0 Z" fill="url(#threads)"/>
    <path d="M700 0 L880 0 C960 220 1040 430 1150 660 C1230 820 1310 930 1350 1000 L1210 1000 C1150 850 1070 680 1010 470 C960 300 840 120 700 0 Z" fill="url(#threads2)"/>
    <path d="M410 0 L720 0 C850 230 960 420 1030 640 C1070 780 1060 900 1050 1000 L990 1000 C1000 860 980 700 900 560 C780 360 560 200 410 0 Z" fill="url(#threads)"/>
    <path d="M410 0 L720 0 C850 230 960 420 1030 640 C1070 780 1060 900 1050 1000 L990 1000 C1000 860 980 700 900 560 C780 360 560 200 410 0 Z" fill="url(#threads2)"/>
  </g>
</svg>
